<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smoke Studies · 2D brush</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
</head>
<body class="app">
<h1 class="sr-only">Stylized smoke drawing tool with hue-shift shading, layered look, and soft drifting embers; brush and living-stroke modes, color palette with history and saved effects.</h1>
<canvas id="gl" class="surface"></canvas>
<div id="nogl" class="notice">This study needs WebGL2.</div>
<a class="back" href="./">← Smoke Studies</a>
<p id="tip" class="tip"></p>

<button id="panel-toggle" class="panel-toggle" aria-controls="panel"><i class="ti ti-adjustments-horizontal" aria-hidden="true"></i></button>
<aside id="panel" class="panel" aria-label="Controls">
  <h2 class="panel-title">01 · 2D brush</h2>
  <div class="panel-section">
    <div class="seg"><button data-mode="brush">Brush</button><button data-mode="livingStroke">Living stroke</button></div>
    <div class="row">
      <button id="undo" class="icon-button" aria-label="Undo" title="Undo (Ctrl/Cmd + Z)"><i class="ti ti-arrow-back-up" aria-hidden="true"></i></button>
      <button id="redo" class="icon-button" aria-label="Redo" title="Redo (Ctrl/Cmd + R or Ctrl/Cmd + Shift + Z)"><i class="ti ti-arrow-forward-up" aria-hidden="true"></i></button>
      <span class="spacer"></span>
      <button id="clr"><i class="ti ti-eraser" aria-hidden="true"></i> Clear</button>
    </div>
  </div>
  <div id="palette" class="panel-section"><span class="section-label">Color</span></div>
  <div id="layers" class="panel-section layers"></div>
  <div id="sliders" class="panel-section sliders"></div>
  <div id="style-panel" class="panel-section"></div>
  <div id="saves" class="panel-section"></div>
</aside>
<script type="module" src="../src/apps/brush-2d.js"></script>
</body>
</html>
