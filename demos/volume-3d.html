<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smoke Studies · 3D volume</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
</head>
<body class="app">
<h1 class="sr-only">3D stylized smoke sandbox: draw smoke anywhere in space, orbit, pan and zoom the camera. The smoke is shaded with hand-drawn rules: flat bands, hue shift, age tint, ember glow.</h1>
<canvas id="gl" class="surface" style="cursor: grab"></canvas>
<div id="nogl" class="notice">This study needs WebGL2.</div>
<a class="back" href="./">← Smoke Studies</a>
<p id="tip" class="tip"></p>

<button id="panel-toggle" class="panel-toggle" aria-controls="panel"><i class="ti ti-adjustments-horizontal" aria-hidden="true"></i></button>
<aside id="panel" class="panel" aria-label="Controls">
  <h2 class="panel-title">03 · 3D volume</h2>
  <div class="panel-section">
    <div class="seg"><button data-v="orbit">Orbit</button><button data-v="draw">Draw</button></div>
    <div class="seg"><button data-mode="brush">Brush</button><button data-mode="livingStroke">Living stroke</button></div>
    <div class="row">
      <button id="undo" class="icon-button" aria-label="Undo" title="Undo (Ctrl/Cmd + Z)"><i class="ti ti-arrow-back-up" aria-hidden="true"></i></button>
      <button id="redo" class="icon-button" aria-label="Redo" title="Redo (Ctrl/Cmd + R or Ctrl/Cmd + Shift + Z)"><i class="ti ti-arrow-forward-up" aria-hidden="true"></i></button>
      <span class="spacer"></span>
      <button id="clr"><i class="ti ti-eraser" aria-hidden="true"></i> Clear</button>
    </div>
  </div>
  <div class="panel-section">
    <span class="section-label">Renderer</span>
    <div class="seg" id="renderers">
      <button data-r="fluid" title="GPU smoke fluid, ray-marched as translucent layered smoke">Fluid</button><button data-r="screen" title="Particles splatted to a screen grid and shaded with the 2D rules (3D v2)">Screen-space</button><button data-r="volume" title="Particles splatted to a fitted voxel grid and ray-marched (3D v1)">Volume</button>
    </div>
  </div>
  <div id="palette" class="panel-section"><span class="section-label">Color</span></div>
  <div id="layers" class="panel-section layers"></div>
  <div id="sliders" class="panel-section sliders"></div>
  <div id="style-panel" class="panel-section"></div>
  <div id="saves" class="panel-section"></div>
</aside>
<script type="module" src="../src/apps/volume-3d.js"></script>
</body>
</html>
